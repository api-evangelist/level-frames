aid: level-frames
name: Level Frames
description: Level Frames is a New York City based online custom framing company founded
  in 2014 by Josh Hubball and Damian Sowers and backed by Y Combinator (Winter 2015).
  The company lets customers design and order handcrafted, made-to-order picture frames
  from home, either by uploading a digital photo for printing and framing or by shipping
  in physical artwork, posters and prints. Its catalog covers custom frames, framed
  canvas prints, framed vinyl records, collage frames, gallery walls, personalized framed
  photos, and framed chalkboards, whiteboards and corkboards, alongside at-home and
  in-studio framing services. Level Frames operates a direct-to-consumer web storefront
  and publishes no public developer program, API, or SDK surface as of this profile.
